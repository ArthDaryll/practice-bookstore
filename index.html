<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Admin Portal</header>
    <div class="layout-wrapper">
        <nav>
            <ul>
                <li><a id="nav-inventory">Inventory</a></li>
                <li><a id="nav-orders">Orders</a></li>
                <li><a id="nav-settings">Settings</a></li>
            </ul>
        </nav>
        <main>
            <div class="inventory-page">
                <h1>Book Inventory</h1>
                <div class="action-bar">
                    <div class="search-group">
                        <input type="search" placeholder="Search...">
                        <button>Search</button>
                    </div>
                    <div class="add-group">
                        <button id="open-add-modal">+ Add New Book</button\>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>ISBN</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="book-list">
                    </tbody>
                </table>
                <footer>
                    <p>&copy; 2026 Book Inventory</p>
                </footer>
            </div>

            <div class="orders-page">
                <h1>Customer Orders</h1>
                <table>
                    <thead>
                        <tr>
                            <th>Transaction ID</th>
                            <th>Customer Name</th>
                            <th>Book Title</th>
                            <th>Order Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-list">
                    </tbody>
                </table>
            </div>
            <div class="settings-page">
            </div>
        </main>
    </div>
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-card">
            <div id="edit-card">
                <h3>Modify This Book</h3>
                <label for="edit-title>">New Title</label>
                <input type="text" id="edit-title" placeholder="New Title">
                <label for="edit-author">New Author</label>
                <input type="text" id="edit-author" placeholder="New Author">
                <label for="edit-isbn">New ISBN</label>
                <input type="text" id="edit-isbn" placeholder="New ISBN">
                <label for="edit-price">New Price</label>
                <input type="number" id="edit-price" placeholder="New Price">
                    <div class="button-group">
                        <button id="save-edit">Save</button>
                        <button id="cancel-edit">Cancel</button>
                    </div>
            </div>
        </div>
    </div>
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-card" id="delete-card">
            <h3>Are you sure?</h3>
            <button id="confirm-delete">Yes, delete</button>
            <button id="cancel-delete">Cancel</button>
        </div>
    </div>
    <div id="add-modal" class="modal-overlay">
        <div class="modal-card" id="add-card">
            <h3>Add New Book</h3>
            <input type="text" id="add-title" placeholder="Title">
            <input type="text" id="add-author" placeholder="Author">
            <input type="text" id="add-isbn" placeholder="ISBN">
            <input type="number" id="add-price" placeholder="Price">
            <div class="button-group">
                <button id="save-add">Save</button>
                <button id="cancel-add">Cancel</button>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
